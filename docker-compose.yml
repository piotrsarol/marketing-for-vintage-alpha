services:
  web:
    build: .
    ports:
      - "5173:80"
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vinted_signal
      POSTGRES_USER: vinted_signal
      POSTGRES_PASSWORD: vinted_signal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: vinted_signal
      DB_POSTGRESDB_USER: vinted_signal
      DB_POSTGRESDB_PASSWORD: vinted_signal
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me}
      N8N_SECURE_COOKIE: "false"
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  postgres_data:
  n8n_data:
