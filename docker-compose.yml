services:
  web:
    build: .
    ports:
      - "5173:3000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      PUBLISH_WEBHOOK_URL: ${PUBLISH_WEBHOOK_URL:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      PRODUCT_NAME: ${PRODUCT_NAME:-Your SaaS product}
      PRODUCT_URL: ${PRODUCT_URL:-https://example.com}
      PRODUCT_DESCRIPTION: ${PRODUCT_DESCRIPTION:-A SaaS product for operators who want better market signals.}
      PRODUCT_AUDIENCE: ${PRODUCT_AUDIENCE:-Vinted sellers, clothing resellers, vintage sellers}
      PRODUCT_LANGUAGE: ${PRODUCT_LANGUAGE:-pl}
      PRODUCT_CTA: ${PRODUCT_CTA:-Join the waitlist for early access.}
      PRODUCT_COUNTRY: ${PRODUCT_COUNTRY:-PL}
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vinted_signal
      POSTGRES_USER: vinted_signal
      POSTGRES_PASSWORD: vinted_signal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: vinted_signal
      DB_POSTGRESDB_USER: vinted_signal
      DB_POSTGRESDB_PASSWORD: vinted_signal
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me}
      N8N_SECURE_COOKIE: "false"
      API_URL: http://web:3000
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  postgres_data:
  n8n_data:
